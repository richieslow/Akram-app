*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",sans-serif;background:#f7f7f8}
input,button,textarea,select{font-family:"DM Sans",sans-serif}
pre{font-family:"DM Sans",sans-serif;white-space:pre-wrap}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#e0e0e0;border-radius:4px}
.app-wrapper{display:flex;min-height:100vh}
.main-content{flex:1;overflow-y:auto;min-height:100vh}
.content-area{max-width:800px;margin:0 auto;padding:16px 16px 32px;width:100%;box-sizing:border-box}
.sidebar{display:none!important}
.mobile-nav{display:none!important}

<div id="error-display" style="display:none;padding:20px;background:red;color:white;font-family:monospace;font-size:12px;position:fixed;top:0;left:0;right:0;z-index:9999;word-break:break-all;max-height:50vh;overflow:auto"></div>
<div id="root"></div>
<script>
window.onerror = function(msg, src, line, col, err) {
  var d = document.getElementById('error-display');
  d.style.display = 'block';
  d.innerHTML = 'ERROR: ' + msg + '<br>Line: ' + line + '<br>Col: ' + col;
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  var d = document.getElementById('error-display');
  d.style.display = 'block';
  d.innerHTML += '<br>PROMISE: ' + e.reason;
});
</script>

function getWeek(){
  const n=new Date(),y=n.getFullYear();
  const s=new Date(y,0,1);
  const w=Math.ceil(((n-s)/86400000+s.getDay()+1)/7);
  return y+"-W"+String(w).padStart(2,"0");
}

function getYTId(url){
  const m=url.match(/youtu\.be\/([^?&]+)/)||url.match(/v=([^&]+)/)||url.match(/embed\/([^?]+)/);
  return m?m[1]:null;
}

function getAgeGroup(dob){
  if(!dob)return "18-34";
  const age=Math.floor((new Date()-new Date(dob))/31557600000);
  if(age<18)return "14-17";
  if(age<35)return "18-34";
  if(age<40)return "35-39";
  if(age<45)return "40-44";
  if(age<50)return "45-49";
  if(age<55)return "50-54";
  if(age<60)return "55-59";
  return "60+";
}

function getLiftScore(value, gender, dob, lift){
  const ageGroup = getAgeGroup(dob);
  const g = gender==="female"?"female":"male";
  const thresholds = (CF_STANDARDS[g][ageGroup]||{})[lift];
  if(!thresholds||!value)return 0;
  const [beg,inter,adv,elite] = thresholds;
  if(value>=elite)return 100;
  if(value>=adv)return 75+Math.round((value-adv)/(elite-adv)*25);
  if(value>=inter)return 50+Math.round((value-inter)/(adv-inter)*25);
  if(value>=beg)return 25+Math.round((value-beg)/(inter-beg)*25);
  return Math.max(0,Math.round((value/beg)*25));
}

function calcFitnessScore(rmHistory, gender, dob){
  if(!rmHistory)return {overall:0,strength:0,metcon:0,gymnastics:0,endurance:0};
  const lifts = Object.keys(rmHistory).filter(l=>rmHistory[l]&&rmHistory[l].length>0);
  if(lifts.length===0)return {overall:0,strength:0,metcon:0,gymnastics:0,endurance:0};
  const strengthLifts = ["Back Squat","Deadlift","Front Squat","Bench Press","Shoulder Press","Push Press"];
  const olympicLifts = ["Clean","Snatch"];
  let strengthScores=[], olympicScores=[];
  lifts.forEach(lift=>{
    const data=rmHistory[lift];
    if(!data||data.length===0)return;
    const best=Math.max(...data.map(d=>d.v));
    const score=getLiftScore(best,gender,dob,lift);
    if(strengthLifts.includes(lift))strengthScores.push(score);
    if(olympicLifts.includes(lift))olympicScores.push(score);
  });
  const avg=arr=>arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length):0;
  const strength=avg([...strengthScores,...olympicScores]);
  // METCON, gymnastics, endurance will be based on WOD logs in future
  // For now estimate from strength level
  const metcon=Math.round(strength*0.9);
  const gymnastics=Math.round(strength*0.85);
  const endurance=Math.round(strength*0.8);
  const overall=Math.round((strength+metcon+gymnastics+endurance)/4);
  return {overall,strength,metcon,gymnastics,endurance};
}

function RMChart({data,color}){
  if(!data||data.length<2)return React.createElement("div",{style:{color:C.muted,fontSize:13,padding:"12px 0"}},"Log at least 2 entries to see chart.");
  const vals=data.map(d=>d.v);
  const minV=Math.min(...vals)-10,maxV=Math.max(...vals)+10;
  const W=400,H=140,pl=40,pb=30;
  const xStep=(W-pl*2)/(data.length-1);
  const toY=v=>H-pb-((v-minV)/(maxV-minV))*(H-pb-20);
  const pts=data.map((d,i)=>[pl+i*xStep,toY(d.v)]);
  const line=pts.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const area=line+" L"+pts[pts.length-1][0].toFixed(1)+","+(H-pb)+" L"+pl+","+(H-pb)+" Z";
  const gid="g"+Math.random().toString(36).slice(2);
  return React.createElement("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",height:"auto"}},
    React.createElement("defs",null,
      React.createElement("linearGradient",{id:gid,x1:"0",y1:"0",x2:"0",y2:"1"},
        React.createElement("stop",{offset:"0%",stopColor:color,stopOpacity:"0.3"}),
        React.createElement("stop",{offset:"100%",stopColor:color,stopOpacity:"0.02"})
      )
    ),
    React.createElement("path",{d:area,fill:"url(#"+gid+")"}),
    React.createElement("path",{d:line,fill:"none",stroke:color,strokeWidth:"2.5",strokeLinecap:"round",strokeLinejoin:"round"}),
    pts.map((p,i)=>React.createElement("g",{key:i},

  );
}

// ── Coach App ─────────────────────────────────────────────────
function CoachApp({user,onLogout}){
  const [tab,setTab]=useState(()=>{try{return localStorage.getItem("akram_coach_tab")||"dashboard";}catch{return "dashboard";}});
  const [coachSidebarOpen,setCoachSidebarOpen]=useState(false);

  const [planLoad,setPlanLoad]=useState(false);
  const [newPR,setNewPR]=useState(false);
  const [bumped,setBumped]=useState(false);

  useEffect(()=>{
    sbGet("athlete_programs","order=created_at.asc&select=*",user.token)

        rows.forEach(function(r){
          var ath=r.athlete_name,week=r.week,day=r.day,blocks=[];
          try{blocks=JSON.parse(r.blocks||"[]");}catch(e){}
          if(!hist[ath])hist[ath]={};

          hist[ath][week][day]=blocks;
        });
        setProgHist(hist);
      }).catch(function(){});

    try{
      if(!dateStr)return "—";
      const parts=String(dateStr).split("-");
      if(parts.length<3)return dateStr;
      const [y,m,d]=parts;
      return lang==="es"?d+"/"+m+"/"+y:m+"/"+d+"/"+y;
    }catch(e){return "—";}
  };
  const [viewWeek,setViewWeek]=useState("2026-W21");

      .then(rows=>{
        if(!Array.isArray(rows))return;
        const hist={};
        rows.forEach(r=>{
          const lift=r.lift||r.movement;
          const val=r.numeric_value||parseFloat(r.value)||0;
          const date=(r.recorded_at||"").slice(0,7);

        var week=r.week,day=r.day,blocks=[];

function App(){
  const [user,setUser]=useState(()=>{try{return JSON.parse(localStorage.getItem("akram_user")||"null");}catch{return null;}});
  const login=u=>{localStorage.setItem("akram_user",JSON.stringify(u));setUser(u);};
  const logout=()=>{localStorage.removeItem("akram_user");setUser(null);};
  const saveProfile=async(p)=>{
    const u={...user,...p,profileComplete:true};
    localStorage.setItem("akram_user",JSON.stringify(u));
    setUser(u);
    // Save to Supabase profiles table
    try{
      await fetch(SURL+"/rest/v1/profiles?id=eq."+user.id,{
        method:"PATCH",
        headers:{apikey:SKEY,"Authorization":"Bearer "+user.token,"Content-Type":"application/json","Prefer":"return=minimal"},
        body:JSON.stringify({
          full_name:p.fullName,
          dob:p.dob||null,
          gender:p.gender,
          nationality:p.nationality,
          phone:p.phone,
          height:p.height,
          weight:p.weight,
          accepted:p.accepted,
          health_form:p.healthForm?JSON.stringify(p.healthForm):null,
          health_lang:p.healthLang||"es"
        })
      });
    }catch(e){console.log("Profile save error:",e);}
  };
  if(!user)return React.createElement(AuthScreen,{onAuth:login});
  if(user.role==="coach")return React.createElement(CoachApp,{user,onLogout:logout});
  if(!user.profileComplete)return React.createElement(OnboardingScreen,{user,onSave:saveProfile,onLogout:logout});
  if(user.active===false)return React.createElement("div",{style:{minHeight:"100vh",background:C.navBg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px 20px",textAlign:"center"}},
    React.createElement("img",{src:LOGO_B64,alt:"AKRAM",style:{width:80,height:80,objectFit:"contain",filter:"none",marginBottom:24}}),
    React.createElement("div",{style:{fontFamily:"Barlow Condensed,sans-serif",fontSize:28,letterSpacing:4,color:C.white,marginBottom:8}},"AKRAM"),
    React.createElement("div",{style:{fontSize:40,marginBottom:16}},"●"),
    React.createElement("div",{style:{fontFamily:"Barlow Condensed,sans-serif",fontSize:24,fontWeight:900,color:C.red,letterSpacing:2,marginBottom:12}},"ACCOUNT INACTIVE"),
    React.createElement("div",{style:{fontSize:14,color:"#9898a6",lineHeight:1.7,maxWidth:300,marginBottom:32}},"Your account is currently inactive. Please contact your coach to reactivate your access."),
    React.createElement("button",{onClick:logout,style:{background:"#1f1f20",border:"1px solid #333",color:"#9898a6",borderRadius:10,padding:"12px 24px",cursor:"pointer",fontSize:14,fontWeight:600}},"Log out")
  );
  return React.createElement(AthleteApp,{user,onLogout:logout,onEditProfile:()=>{
    const u={...user,profileComplete:false};
    localStorage.setItem("akram_user",JSON.stringify(u));
    setUser(u);
  }});
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(
  class extends React.Component {
    constructor(props){super(props);this.state={error:null};}
    static getDerivedStateFromError(e){return {error:e.message};}
    render(){
      if(this.state.error)return React.createElement("div",{style:{padding:20,color:"red",fontFamily:"monospace"}},"Error: "+this.state.error);
      return React.createElement(App);
    }
  }
));
</script>
</body>
</html>
