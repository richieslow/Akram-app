<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AKRAM TEST</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
</head>
<body style="margin:0;background:#0f0f10;color:white;font-family:sans-serif">
<div id="root"></div>
<script type="text/babel" data-presets="react,env">
const {useState} = React;

function App() {
  const [screen, setScreen] = useState('home');
  const screens = ['home','prs','nutrition','blog','program','analyze','movements','profile'];
  return React.createElement('div', {style:{padding:20}},
    React.createElement('div', {style:{marginBottom:20}},
      screens.map(s => React.createElement('button', {
        key:s,
        onClick:()=>setScreen(s),
        style:{margin:4,padding:'8px 12px',background:screen===s?'#dc2020':'#333',color:'white',border:'none',borderRadius:8,cursor:'pointer'}
      }, s))
    ),
    React.createElement('div', {style:{fontSize:24,color:'#dc2020'}}, screen.toUpperCase() + ' SCREEN')
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
