<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",sans-serif;background:#ffffff}
input,button,textarea,select{font-family:"DM Sans",sans-serif}
pre{font-family:"DM Sans",sans-serif;white-space:pre-wrap}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#e0e0e0;border-radius:4px}
@media (orientation:landscape) and (min-width:500px){
  .rings-landscape{flex-direction:row!important;gap:12px!important;}
}
.app-wrapper{display:flex;min-height:100vh}
.main-content{flex:1;overflow-y:auto}
.content-area{max-width:800px;margin:0 auto;padding:16px 16px 32px;width:100%;box-sizing:border-box}
.sidebar{display:none!important}
.mobile-nav{display:none!important}
</style>

<div id="error-display" style="display:none;padding:20px;background:red;color:white;font-family:monospace;font-size:12px;position:fixed;top:0;left:0;right:0;z-index:9999;word-break:break-all;max-height:50vh;overflow:auto"></div>
<div id="root"></div>
<script>
window.onerror = function(msg, src, line, col, err) {
  var d = document.getElementById('error-display');
  d.style.display = 'block';
  d.innerHTML = 'ERROR: ' + msg + '<br>Line: ' + line + '<br>Col: ' + col;
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  var d = document.getElementById('error-display');
  d.style.display = 'block';
  d.innerHTML += '<br>PROMISE: ' + e.reason;
});
</script>

function getWeek(){
  const n=new Date();
  const d=new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()));
  const day=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-day);
  const y=d.getUTCFullYear();
  const w=Math.ceil(((d-new Date(Date.UTC(y,0,1)))/86400000+1)/7);
  return y+"-W"+String(w).padStart(2,"0");
}
function getNextWeek(){
  const n=new Date();
  const d=new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()));
  d.setUTCDate(d.getUTCDate()+7);
  const day=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-day);
  const y=d.getUTCFullYear();
  const w=Math.ceil(((d-new Date(Date.UTC(y,0,1)))/86400000+1)/7);
  return y+"-W"+String(w).padStart(2,"0");
}

function getYTId(url){
  const m=url.match(/youtu\.be\/([^?&]+)/)||url.match(/v=([^&]+)/)||url.match(/embed\/([^?]+)/);
  return m?m[1]:null;
}

async function sbIn(email,pass){
  const r=await fetch(SURL+"/auth/v1/token?grant_type=password",{
    method:"POST",headers:{apikey:SKEY,"Content-Type":"application/json"},
    body:JSON.stringify({email,password:pass})
  });
  return r.json();
}

async function sbUp(email,pass,name){
  const r=await fetch(SURL+"/auth/v1/signup",{
    method:"POST",headers:{apikey:SKEY,"Content-Type":"application/json"},
    body:JSON.stringify({email,password:pass,data:{name,role:"athlete"}})
  });
  return r.json();
}

async function sbGet(table,q,tok){
  const r=await fetch(SURL+"/rest/v1/"+table+"?"+q,{
    headers:{apikey:SKEY,"Authorization":"Bearer "+(tok||SKEY),"Content-Type":"application/json"}
  });
  return r.json();
}

async function sbPost(table,data,tok){
  await fetch(SURL+"/rest/v1/"+table,{
    method:"POST",
    headers:{apikey:SKEY,"Authorization":"Bearer "+(tok||SKEY),"Content-Type":"application/json","Prefer":"return=representation"},
    body:JSON.stringify(data)
  });
}

function getAgeGroup(dob){
  if(!dob)return "18-34";
  const age=Math.floor((new Date()-new Date(dob))/31557600000);
  if(age<18)return "14-17";
  if(age<35)return "18-34";
  if(age<40)return "35-39";
  if(age<45)return "40-44";
  if(age<50)return "45-49";
  if(age<55)return "50-54";
  if(age<60)return "55-59";
  return "60+";
}

function getLiftScore(value, gender, dob, lift){
  const ageGroup = getAgeGroup(dob);
  const g = gender==="female"?"female":"male";
  const thresholds = (CF_STANDARDS[g][ageGroup]||{})[lift];
  if(!thresholds||!value)return 0;
  const [beg,inter,adv,elite] = thresholds;
  // CrossFit population percentiles:
  // Below Beginner: 0-20% | Beginner: 20-40% | Intermediate: 40-60% | Advanced: 60-80% | Elite: 80-100%
  if(value>=elite)return 100;
  if(value>=adv)return 80+Math.round((value-adv)/(elite-adv)*20);
  if(value>=inter)return 60+Math.round((value-inter)/(adv-inter)*20);
  if(value>=beg)return 40+Math.round((value-beg)/(inter-beg)*20);
  return Math.max(0,Math.round((value/beg)*40));
}

// Based on CrossFit Open masters performance data

// 50-54 factor 1.62 → Fran mean = 250*1.62 = 405s (6:45) → 4:21 = ~87th percentile
const AGE_FACTORS={
  "14-17":0.95,"18-34":1.0,"35-39":1.10,"40-44":1.22,
  "45-49":1.38,"50-54":1.62,"55-59":1.82,"60+":2.05

// Normal CDF approximation (Abramowitz & Stegun)
function normCDF(z){
  if(z>6)return 1;if(z<-6)return 0;
  var t=1/(1+0.2316419*Math.abs(z));
  var d=0.3989423*Math.exp(-z*z/2);
  var p=d*t*(0.3193815+t*(-0.3565638+t*(1.7814779+t*(-1.8212560+t*1.3302744))));
  return z>=0?1-p:p;
}
function scoreBenchmark(scoreStr,wodName,gender,ageGroup){
  var ag=ageGroup||"18-34";
  var norm=BTWB_NORMS[wodName.toUpperCase()];
  if(!norm||!scoreStr)return null;
  var agFactor=AGE_FACTORS[ag]||1.0;
  var gKey=gender==="female"?"female":"male";
  var mean=gKey==="female"?norm.mean_female*agFactor:norm.mean_male*agFactor;
  var sd=gKey==="female"?norm.sd_female*agFactor:norm.sd_male*agFactor;
  var val=0;
  if(norm.type==="time"){
    var s=scoreStr.trim();
    if(s.includes(":")){var p=s.split(":");val=parseInt(p[0])*60+parseInt(p[1]||0);}
    else val=parseInt(s);
    if(!val||isNaN(val)||val<=0)return null;
    // Time: lower is better → percentile = P(X > val) = 1 - CDF((val-mean)/sd)
    var z=(val-mean)/sd;
    var pct=Math.round((1-normCDF(z))*100);
    return Math.min(99,Math.max(1,pct));
  } else {
    val=parseFloat(scoreStr);
    if(isNaN(val))return null;
    // Rounds/reps: higher is better → percentile = CDF((val-mean)/sd)
    var z2=(val-mean)/sd;
    var pct2=Math.round(normCDF(z2)*100);
    return Math.min(99,Math.max(1,pct2));
  }
}

function scoreOpenWod(scoreStr, wodId, division, gender, ageGroup){
  if(!scoreStr||!wodId)return null;
  var std=OPEN_STANDARDS[wodId];
  if(!std)return null;
  // Build division key: "rx_male", "50-54_male", etc.
  var g=gender==="female"?"female":"male";
  var div=division==="rx"||division==="scaled"?"rx":division;
  var key=div+"_"+g;
  var thresholds=std.divisions[key];
  // Fallback to rx if age group not found
  if(!thresholds)thresholds=std.divisions["rx_"+g];
  if(!thresholds)return null;
  var val=0;
  if(std.type==="time"){
    var s=scoreStr.trim();
    if(s.includes(":")){var p=s.split(":");val=parseInt(p[0])*60+parseInt(p[1]||0);}
    else val=parseInt(s);
    if(!val||isNaN(val))return null;
    var cap=thresholds[0]; // p20 = time cap for most
    // For time: lower is better
    var[p20,p40,p60,p80]=thresholds;
    if(val<=p80)return 100;
    if(val<=p60)return 80+Math.round((p60-val)/(p60-p80)*20);
    if(val<=p40)return 60+Math.round((p40-val)/(p40-p60)*20);
    if(val<=p20)return 40+Math.round((p20-val)/(p20-p40)*20);
    return Math.max(0,Math.round(((p20*2-val)/p20)*40));
  } else {
    val=parseFloat(scoreStr);
    if(isNaN(val))return null;
    var[p20,p40,p60,p80]=thresholds;
    if(val>=p80)return 100;
    if(val>=p60)return 80+Math.round((val-p60)/(p80-p60)*20);
    if(val>=p40)return 60+Math.round((val-p40)/(p60-p40)*20);
    if(val>=p20)return 40+Math.round((val-p20)/(p40-p20)*20);
    return Math.max(0,Math.round((val/p20)*40));
  }
}
function calcFitnessScore(rmHistory, gender, dob, benchScores){
  if(!rmHistory)return {overall:0,overallGeneral:0,strength:0,strengthGeneral:0,olympic:0,olympicGeneral:0,metcon:0,gymnastics:0};
  const lifts=Object.keys(rmHistory).filter(l=>rmHistory[l]&&rmHistory[l].length>0);
  if(lifts.length===0&&(!benchScores||Object.keys(benchScores).length===0))return {overall:0,overallGeneral:0,strength:0,strengthGeneral:0,olympic:0,olympicGeneral:0,metcon:0,gymnastics:0};
  const STRENGTH_LIFTS=["Back Squat","Front Squat","Overhead Squat","Deadlift","Romanian Deadlift","Sumo Deadlift","Deficit Deadlift","Rack Pull","Shoulder Press","Push Press","Bench Press","Incline Bench Press","Close Grip Bench Press","Good Morning","Pause Squat","Tempo Squat","Box Squat","Zercher Squat","Pendlay Row","Barbell Row","Hip Thrust","Glute Bridge"];
  const OLYMPIC_LIFTS=["Squat Snatch","Snatch","Power Snatch","Hang Squat Snatch","Hang Snatch","Snatch Balance","Snatch Pull","Snatch Deadlift","Hang Power Snatch","High Hang Snatch","High Hang Power Snatch","BTN Snatch Grip Shoulder Press","BTN Snatch Grip Push Press","BTN Snatch Grip Push Jerk","Squat Clean","Clean","Power Clean","Hang Squat Clean","Hang Clean","Hang Power Clean","Hand Power Clean","Clean Pull","Clean Deadlift","Clean & Jerk","Jerk","Split Jerk","Push Jerk","Power Jerk","Muscle Snatch","Muscle Clean"];
  const avg=arr=>arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length):0;
  const g=gender==="female"?"female":"male";
  const ageGroup=getAgeGroup(dob);
  function scoreForGroup(value,g,ag,lift){
    const thresholds=(CF_STANDARDS[g][ag]||{})[lift];
    if(!thresholds||!value)return 0;
    const [beg,inter,adv,elite]=thresholds;
    if(value>=elite)return 100;
    if(value>=adv)return 80+Math.round((value-adv)/(elite-adv)*20);
    if(value>=inter)return 60+Math.round((value-inter)/(adv-inter)*20);
    if(value>=beg)return 40+Math.round((value-beg)/(inter-beg)*20);
    return Math.max(0,Math.round((value/beg)*40));
  }
  let strengthScores=[],olympicScores=[],strengthGenScores=[],olympicGenScores=[];
  const estOneRM=(v,reps)=>reps&&reps>1?Math.round(v*(1+reps/30)):v;
  lifts.forEach(lift=>{
    const data=rmHistory[lift];
    if(!data||data.length===0)return;
    // Skip gymnastics (reps) lifts from weight-based scoring
    if(data.every(d=>d.unit==="reps"))return;
    const best=Math.max(...data.map(d=>estOneRM(d.v,d.reps||1)));
    if(STRENGTH_LIFTS.includes(lift)){
      var ss=scoreForGroup(best,g,ageGroup,lift);var ssg=scoreForGroup(best,g,"18-34",lift);
      if((CF_STANDARDS[g][ageGroup]||{})[lift]){strengthScores.push(ss);strengthGenScores.push(ssg);}
    } else if(OLYMPIC_LIFTS.includes(lift)){
      var os=scoreForGroup(best,g,ageGroup,lift);var osg=scoreForGroup(best,g,"18-34",lift);
      if((CF_STANDARDS[g][ageGroup]||{})[lift]){olympicScores.push(os);olympicGenScores.push(osg);}
    }
  });
  const strength=avg(strengthScores),olympic=avg(olympicScores),strengthGeneral=avg(strengthGenScores),olympicGeneral=avg(olympicGenScores);
  // Gymnastics — calculated exclusively from benchmarks (Girls + Hero + Open)
  const gymScores=[],gymGenScores=[];
  // Benchmark gymnastics component — benchmarks that contain gymnastics movements
  const GYM_BENCHMARKS_PURE=["CINDY","MARY","ANGIE","BARBARA","CHELSEA","JT","MURPH"];
  const GYM_BENCHMARKS_PARTIAL=["FRAN","HELEN","DIANE","ELIZABETH","JACKIE","NICOLE","DANIEL","JOSH","JASON","BADGER","NATE","RYAN","ERIN"];
  if(benchScores){
    Object.entries(benchScores).forEach(function([name,data]){
      if(name.match(/^\d{2}\.\d+[a-z]?_/)){
        // Open WOD — score vs age group and vs 18-34 general
        var parts=name.split("_");
        var wodId=parts[0];
        var division=parts.slice(1).join("_");
        var s=scoreOpenWod(data.score,wodId,division,gender,ageGroup);
        var sGen=scoreOpenWod(data.score,wodId,"rx",gender,"18-34");
        if(s!==null)gymScores.push(s);
        if(sGen!==null)gymGenScores.push(sGen);
        return;
      }
      var uname=name.toUpperCase();
      var isPure=GYM_BENCHMARKS_PURE.indexOf(uname)>-1;
      var isPartial=GYM_BENCHMARKS_PARTIAL.indexOf(uname)>-1;
      if(!isPure&&!isPartial)return;
      var s=scoreBenchmark(data.score,name,gender,ageGroup);
      var sGen=scoreBenchmark(data.score,name,gender,"18-34");
      if(s!==null)gymScores.push(s);
      if(sGen!==null)gymGenScores.push(sGen);
    });
  }
  const gymnastics=avg(gymScores),gymnastics_general=avg(gymGenScores);
  // Metcon: benchmark scores (Girls + Hero) via BENCH_STANDARDS
  const metconScores=[];
  if(benchScores){
    Object.entries(benchScores).forEach(([name,data])=>{
      // Skip Open WOD entries (format: "25.3_50-54") from metcon — they are used in overall directly
      if(name.match(/^\d{2}\.\d+[a-z]?_/))return;
      const s=scoreBenchmark(data.score,name,gender,ageGroup);
      if(s!==null)metconScores.push(s);
    });
  }
  const metcon=avg(metconScores);
  // Overall & Age Group = average of ALL benchmarks logged (Girls + Hero + Open)
  // This is how CrossFit/BTWB calculates overall fitness — from real workout performance
  const allBenchScores=[];
  const allBenchScoresGen=[];
  if(benchScores){
    Object.entries(benchScores).forEach(([name,data])=>{
      var s=null;
      if(name.match(/^\d{2}\.\d+[a-z]?_/)){
        // Open WOD: score by comparing against Open standards for that division
        var parts=name.split("_");
        var wodId=parts[0];
        var division=parts.slice(1).join("_");
        s=scoreOpenWod(data.score,wodId,division,gender,ageGroup);
      } else {
        // Girls / Hero: scored vs athlete age group
        s=scoreBenchmark(data.score,name,gender,ageGroup);
      }
      if(s!==null){
        allBenchScores.push(s);
        // For general (18-34 comparison): Open WODs scored vs rx/general, Girls/Hero same
        var sGen=null;
        if(name.match(/^\d{2}\.\d+[a-z]?_/)){
          var partsG=name.split("_");
          sGen=scoreOpenWod(data.score,partsG[0],"rx",gender,"18-34");
        } else {
          sGen=scoreBenchmark(data.score,name,gender,"18-34");
        }
        if(sGen!==null)allBenchScoresGen.push(sGen);
      }
    });
  }
  console.log("[AKRAM DEBUG] benchScores keys:",benchScores?Object.keys(benchScores):[]);console.log("[AKRAM DEBUG] allBenchScores:",allBenchScores);console.log("[AKRAM DEBUG] allBenchScoresGen:",allBenchScoresGen);console.log("[AKRAM DEBUG] gymScores:",gymScores);console.log("[AKRAM DEBUG] metconScores:",metconScores);console.log("[AKRAM DEBUG] strengthScores:",strengthScores);console.log("[AKRAM DEBUG] olympicScores:",olympicScores);
  const overall=allBenchScores.length>0?Math.round(allBenchScores.reduce(function(a,b){return a+b;},0)/allBenchScores.length):0;
  const overallGeneral=allBenchScoresGen.length>0?Math.round(allBenchScoresGen.reduce(function(a,b){return a+b;},0)/allBenchScoresGen.length):0;
  return {overall,overallGeneral,strength,strengthGeneral,olympic,olympicGeneral,metcon,gymnastics,gymnastics_general};
}

function RMChart({data,color}){
  if(!data||data.length<2)return React.createElement("div",{style:{color:C.muted,fontSize:13,padding:"12px 0"}},"Log at least 2 entries to see chart.");
  const vals=data.map(d=>d.v);
  const minV=Math.min(...vals)-10,maxV=Math.max(...vals)+10;
  const W=400,H=140,pl=40,pb=30;
  const xStep=(W-pl*2)/(data.length-1);
  const toY=v=>H-pb-((v-minV)/(maxV-minV))*(H-pb-20);
  const pts=data.map((d,i)=>[pl+i*xStep,toY(d.v)]);
  const line=pts.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const area=line+" L"+pts[pts.length-1][0].toFixed(1)+","+(H-pb)+" L"+pl+","+(H-pb)+" Z";
  const gid="g"+Math.random().toString(36).slice(2);
  return React.createElement("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",height:"auto"}},
    React.createElement("defs",null,
      React.createElement("linearGradient",{id:gid,x1:"0",y1:"0",x2:"0",y2:"1"},
        React.createElement("stop",{offset:"0%",stopColor:color,stopOpacity:"0.3"}),
        React.createElement("stop",{offset:"100%",stopColor:color,stopOpacity:"0.02"})
      )
    ),
    React.createElement("path",{d:area,fill:"url(#"+gid+")"}),
    React.createElement("path",{d:line,fill:"none",stroke:color,strokeWidth:"2.5",strokeLinecap:"round",strokeLinejoin:"round"}),

      React.createElement("text",{x:p[0].toFixed(1),y:(H-5).toFixed(1),fontSize:"9",fill:C.muted,textAnchor:"middle"},data[i].date)

        fetch(SURL+"/rest/v1/personal_records?athlete_id=eq."+viewAth.id+"&order=recorded_at.asc&select=*",{headers:coachHeaders}).then(function(r){if(!r.ok)throw new Error("PR");return r.json();}),

      ]).then(function(results){
        var rmRows=results[0];var benchRows=results[1];
        if(Array.isArray(rmRows)){
          var hist={};
          rmRows.forEach(function(r){
            var lift=r.lift||r.movement;
            var RM_NAME_MAP={"Clean":"Squat Clean","Hang Clean":"Hang Squat Clean","Snatch":"Squat Snatch","Hang Snatch":"Hang Squat Snatch"};
            if(lift&&RM_NAME_MAP[lift])lift=RM_NAME_MAP[lift];
            var val=r.numeric_value||parseFloat(r.value)||0;
            var raw=(r.recorded_at||"").slice(0,10);var date=raw?(function(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];})(raw):'';
            var reps=r.reps||1;var unit=r.unit||"weight";
            if(!lift||!val)return;
            if(!hist[lift])hist[lift]=[];
            hist[lift].push({date:date,v:val,reps:reps,unit:unit,id:r.id});
          });
          setAthRmHist(hist);
        }
        if(Array.isArray(benchRows)){
          var bench={};
          benchRows.forEach(function(r){bench[r.wod_name]={score:r.score,date:r.date,scaling:r.scaling||"Rx"};});
          setAthBenchScores(bench);
        }
        setAthDataLoading(false);
      }).catch(function(e){
        console.warn("AKRAM: error coach datos (intento "+coachAttempts+")",e);
        if(coachAttempts<3){
          setTimeout(loadCoachData,1500*coachAttempts);
        } else {
          setAthDataLoading(false);
        }
      });
    }
    loadCoachData();
    setAthWorkoutLogs([]);
    setAthPrograms([]);

      headers:{apikey:SKEY,"Authorization":authHeader}
    }).then(function(r){return r.json();}).then(function(rows){
      if(!Array.isArray(rows))return;
      setAthWorkoutLogs(rows);
      var fb={};

      .then(rows=>{
        if(!Array.isArray(rows)){setAthLoading(false);return;}
        const colors=[C.blue,C.red,C.green,C.orange];
        const newPayments={};
        rows.forEach(r=>{
          if(r.payment_history){
            try{
              const ph=typeof r.payment_history==="string"?JSON.parse(r.payment_history):r.payment_history;
              if(Array.isArray(ph)){ph.forEach(p=>{if(!newPayments[r.id])newPayments[r.id]={};newPayments[r.id][p.monthKey]={paid:p.paid!==false,amount:p.amount||0,date:p.date||null};});}
            }catch(e){}
          }
        });
        if(Object.keys(newPayments).length>0)setPayments(prev=>({...prev,...newPayments}));
        const mappedRows=rows.map((r,i)=>({
          ...r,
          fullName:r.full_name||r.name||(r.email?r.email.split("@")[0]:"")||"—",

          av:(r.full_name||r.name||r.email||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase(),
          col:colors[i%colors.length],
          next_payment:r.next_payment||r.Next_payment||"",
          freePass:r.free_pass||false,
          score:0,
          overall:0,
          ageGroup:0,
          level:"Beginner",
        }));
        setAthletes(mappedRows);
        mappedRows.forEach(function(ath){
          var authHeader=user.token?"Bearer "+user.token:SKEY;
          Promise.all([
            fetch(SURL+"/rest/v1/personal_records?athlete_id=eq."+ath.id+"&order=recorded_at.asc&select=*",{headers:{apikey:SKEY,"Authorization":authHeader}}).then(function(r){return r.json();}),
            fetch(SURL+"/rest/v1/benchmark_scores?athlete_id=eq."+ath.id+"&select=*",{headers:{apikey:SKEY,"Authorization":authHeader}}).then(function(r){return r.json();})
          ]).then(function(results){
            var rmRows=results[0];var benchRows=results[1];
            var hist={};
            if(Array.isArray(rmRows)){rmRows.forEach(function(r){var lift=r.lift||r.movement;var val=r.numeric_value||parseFloat(r.value)||0;var reps=r.reps||1;var unit=r.unit||"weight";if(!lift||!val)return;if(!hist[lift])hist[lift]=[];hist[lift].push({v:val,reps:reps,unit:unit});});}
            var bench={};
            if(Array.isArray(benchRows)){benchRows.forEach(function(r){bench[r.wod_name]={score:r.score,date:r.date,scaling:r.scaling||"Rx"};});}
            var fs=calcFitnessScore(hist,ath.gender,ath.dob,bench);
            var lvl=function(v){return v>=80?"Elite":v>=60?"Advanced":v>=40?"Intermediate":"Beginner";};
            setAthletes(function(prev){return prev.map(function(a){return a.id===ath.id?{...a,score:fs.overall,overall:fs.overall,ageGroup:fs.overallGeneral,level:lvl(fs.overall)}:a;});});
          }).catch(function(){});
        });
      })
      .catch(()=>{})
      .finally(()=>setAthLoading(false));
  },[]);
  const [progAth,setProgAth]=useState("");

  const [progDays,setProgDays]=useState({});

  const [editingBriefing,setEditingBriefing]=useState(false);
  const [briefingSaved,setBriefingSaved]=useState(false);
  const [progSaved,setProgSaved]=useState(false);
  const [bookings,setBookings]=useState([]);

  const [bookingSaved,setBookingSaved]=useState(false);

        else if((!cats[condIdx].movements||cats[condIdx].movements.length===0)&&defCond&&defCond.movements.length>0){cats[condIdx]=Object.assign({},cats[condIdx],{movements:defCond.movements});}
        setCoachCats(cats);
      }
    }).catch(()=>{});
  },[]);

  const addExternalPayment=()=>{
    if(!extForm.name.trim()||!extForm.amount)return;
    const monthKey=new Date().getFullYear()+"-"+String(new Date().getMonth()+1).padStart(2,"0");

    fetch(SURL+"/rest/v1/external_payments",{method:"POST",
      headers:{apikey:SKEY,"Authorization":"Bearer "+(user.token||SKEY),"Content-Type":"application/json","Prefer":"return=representation"},

    }).then(r=>r.json()).then(rows=>{

      setExtError("");
      setShowAddExternal(false);
    }).catch(e=>{setExtError("Network error: "+e);});
  };
  const deleteExternalPayment=(id)=>{
    setExternalPayments(prev=>prev.filter(p=>p.id!==id));
    fetch(SURL+"/rest/v1/external_payments?id=eq."+id,{method:"DELETE",
      headers:{apikey:SKEY,"Authorization":"Bearer "+(user.token||SKEY)}
    }).catch(()=>{});
  };

  // Accounting state
  const [nextPaySaved,setNextPaySaved]=useState(false);
  const [nextPayInput,setNextPayInput]=useState("");
  const [nextPayEdit,setNextPayEdit]=useState(false);

    setPayments(prev=>{
      const updated={...prev,[athId]:{...(prev[athId]||{}),[monthKey]:{paid:true,amount,date:new Date().toISOString().slice(0,10)}}};
      const ph=Object.entries(updated[athId]||{}).map(([k,v])=>({monthKey:k,...v}));

      return updated;

      const ph=Object.entries(updated[athId]||{}).map(([k,v])=>({monthKey:k,...v}));
      fetch(SURL+"/rest/v1/profiles?id=eq."+athId,{method:"PATCH",headers:{apikey:SKEY,"Authorization":"Bearer "+(user.token||SKEY),"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({payment_history:JSON.stringify(ph)})}).catch(()=>{});
      return updated;

// ── Streak Calculator ─────────────────────────────────────────
function calcStreak(rmHist, benchScores, wodScores) {
  // Collect all unique training dates from rmHist, benchScores and wodScores
  const dateSet = new Set();

  // From RM history
  Object.values(rmHist || {}).forEach(function(entries) {
    (entries || []).forEach(function(e) { if (e.date) dateSet.add(e.date); });
  });

  // From benchmark scores
  Object.values(benchScores || {}).forEach(function(data) {
    if (data && data.date) dateSet.add(data.date);
  });

  // From workout logs (keys are week_day_blockName, logged_at not available here so use today when score exists)
  // Use logged_at from the load — scores keys don't carry date, so we use the current date for any score logged today
  // Better: extract date from week key e.g. "2026-W22_Monday_WOD" -> derive from week
  Object.keys(wodScores || {}).forEach(function(k) {
    if(!wodScores[k] || k.endsWith("_DAY_DONE")) return;
    // Key format: YYYY-Www_Day_BlockName — extract week and derive Monday date
    var parts = k.split("_");
    if(parts.length >= 2) {
      var weekStr = parts[0]; // e.g. "2026-W22"
      var dayName = parts[1]; // e.g. "Monday"
      var dayOffset = {Monday:0,Tuesday:1,Wednesday:2,Thursday:3,Friday:4,Saturday:5,Sunday:6};
      var m = weekStr.match(/(\d{4})-W(\d{2})/);
      if(m) {
        var year = parseInt(m[1]), week = parseInt(m[2]);
        var jan4 = new Date(year, 0, 4);
        var monday = new Date(jan4);
        monday.setDate(jan4.getDate() - ((jan4.getDay()+6)%7) + (week-1)*7);
        var offset = dayOffset[dayName];
        if(offset !== undefined) {
          var d = new Date(monday);
          d.setDate(monday.getDate() + offset);
          dateSet.add(d.toISOString().slice(0,10));
        }
      }
    }
  });

  if (dateSet.size === 0) return 0;

  // Sort dates descending
  const dates = Array.from(dateSet).sort(function(a, b) { return b.localeCompare(a); });

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const todayStr = today.toISOString().slice(0, 10);
  const yest = new Date(today); yest.setDate(yest.getDate() - 1);
  const yesterdayStr = yest.toISOString().slice(0, 10);

  // Streak must start from today or yesterday (allow logging after midnight)
  if (dates[0] !== todayStr && dates[0] !== yesterdayStr) return 0;

  let streak = 0;
  let ref = new Date(dates[0]);
  ref.setHours(0, 0, 0, 0);

  for (let i = 0; i < dates.length; i++) {
    const d = new Date(dates[i]); d.setHours(0, 0, 0, 0);
    const diffDays = Math.round((ref - d) / 86400000);
    if (i === 0 || diffDays <= 1) {
      streak++;
      ref = d;
    } else {
      break;
    }
  }
  return streak;
}

function App(){
  const [user,setUser]=useState(()=>{try{return JSON.parse(localStorage.getItem("akram_user")||"null");}catch{return null;}});
  const login=u=>{localStorage.setItem("akram_user",JSON.stringify(u));setUser(u);};
  const logout=()=>{localStorage.removeItem("akram_user");setUser(null);};
  // Refresh token on mount if we have a refresh_token saved
  useEffect(()=>{
    if(!user||!user.refreshToken)return;
    fetch(SURL+"/auth/v1/token?grant_type=refresh_token",{
      method:"POST",
      headers:{apikey:SKEY,"Content-Type":"application/json"},
      body:JSON.stringify({refresh_token:user.refreshToken})
    }).then(r=>r.json()).then(d=>{
      if(d.access_token){
        const u={...user,token:d.access_token,refreshToken:d.refresh_token||user.refreshToken};
        localStorage.setItem("akram_user",JSON.stringify(u));
        setUser(u);
      }
    }).catch(()=>{});
  },[]);
  useEffect(()=>{
    if(!user||user.role==="coach"||!user.id||!user.token)return;
    fetch(SURL+"/rest/v1/profiles?id=eq."+user.id+"&select=avatar_url",{
      headers:{apikey:SKEY,"Authorization":"Bearer "+(user.token||SKEY)}
    }).then(function(r){return r.json();}).then(function(prof){
      if(prof&&prof[0]&&prof[0].avatar_url){
        setAvatarUrl(prof[0].avatar_url);
        try{var stored=JSON.parse(localStorage.getItem("akram_user")||"{}");stored.avatar_url=prof[0].avatar_url;localStorage.setItem("akram_user",JSON.stringify(stored));}catch(e){}
      }
    }).catch(function(){});
  },[]);
  const saveProfile=async(p)=>{
    const u={...user,...p,profileComplete:true};
    localStorage.setItem("akram_user",JSON.stringify(u));
    setUser(u);
    // Save to Supabase profiles table
    try{
      await fetch(SURL+"/rest/v1/profiles?id=eq."+user.id,{
        method:"PATCH",
        headers:{apikey:SKEY,"Authorization":"Bearer "+(user.token||SKEY),"Content-Type":"application/json","Prefer":"return=minimal"},
        body:JSON.stringify({
          full_name:p.fullName,
          dob:p.dob||null,
          gender:p.gender,
          nationality:p.nationality,
          phone:p.phone,
          height:p.height,
          weight:p.weight,
          accepted:p.accepted,
          health_form:p.healthForm?JSON.stringify(p.healthForm):null,
          health_lang:p.healthLang||"es"
        })
      });
    }catch(e){console.log("Profile save error:",e);}
  };
  if(!user)return React.createElement(AuthScreen,{onAuth:login});
  if(user.role==="coach")return React.createElement(CoachApp,{user,onLogout:logout});
  if(!user.profileComplete)return React.createElement(OnboardingScreen,{user,onSave:saveProfile,onLogout:logout});
  if(user.active===false)return React.createElement("div",{style:{minHeight:"100vh",background:C.navBg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px 20px",textAlign:"center"}},
    React.createElement("img",{src:LOGO_B64,alt:"AKRAM",style:{width:80,height:80,objectFit:"contain",filter:"none",marginBottom:24}}),
    React.createElement("div",{style:{fontFamily:"Barlow Condensed,sans-serif",fontSize:28,letterSpacing:4,color:C.white,marginBottom:8}},"AKRAM"),
    React.createElement("div",{style:{fontSize:40,marginBottom:16}},"●"),
    React.createElement("div",{style:{fontFamily:"Barlow Condensed,sans-serif",fontSize:24,fontWeight:900,color:C.red,letterSpacing:2,marginBottom:12}},"ACCOUNT INACTIVE"),
    React.createElement("div",{style:{fontSize:14,color:"#9898a6",lineHeight:1.7,maxWidth:300,marginBottom:32}},"Your account is currently inactive. Please contact your coach to reactivate your access."),
    React.createElement("button",{onClick:logout,style:{background:"#1f1f20",border:"1px solid #333",color:"#9898a6",borderRadius:10,padding:"12px 24px",cursor:"pointer",fontSize:14,fontWeight:600}},"Log out")
  );
  return React.createElement(AthleteApp,{user,onLogout:logout,onEditProfile:()=>{
    const u={...user,profileComplete:false};
    localStorage.setItem("akram_user",JSON.stringify(u));
    setUser(u);
  }});
}

  class extends React.Component {
    constructor(props){super(props);this.state={error:null};}
    static getDerivedStateFromError(e){return {error:e.message};}
    render(){
      if(this.state.error)return React.createElement("div",{style:{padding:20,color:"red",fontFamily:"monospace"}},"Error: "+this.state.error);
      return React.createElement(App);
    }

));
